
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="login-container">
        <h1>BookStore</h1>
        <p>Selamat datang di toko buku online</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required>

            <button type="submit">Login</button>
        </form>

        <div class="login-links">
            <button type="button" onclick="bukaModal('lupaModal')">
                Lupa Password?
            </button>

            <button type="button" onclick="bukaModal('daftarModal')">
                Daftar
            </button>
        </div>
    </main>

    <!-- Modal Lupa Password -->
    <div id="lupaModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="tutupModal('lupaModal')">&times;</span>
            <h2>Lupa Password</h2>
            <input type="email" placeholder="Masukkan email">
            <button type="button" onclick="alert('Silakan cek email Anda')">
                Kirim
            </button>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="daftarModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="tutupModal('daftarModal')">&times;</span>
            <h2>Daftar Akun</h2>
            <input type="text" placeholder="Nama lengkap">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button type="button" onclick="alert('Pendaftaran berhasil disimulasikan')">
                Daftar
            </button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
